name: CPU and Qt checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 opencv-python-headless==4.11.0.86 Pillow PySide6
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/workspace_reset.py
